[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-council"
version = "0.1.0"
description = "A multi-model deliberation engine: blind, critique, consensus-map, adversarial, and synthesis rounds over a panel of language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agents", "deliberation", "ensemble", "multi-model"]
dependencies = []

[project.scripts]
quorum = "quorum.cli:main"
quorum-web = "quorum.web.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.27"]

[tool.setuptools.packages.find]
include = ["quorum*"]

[tool.setuptools.package-data]
"quorum.web" = ["static/*"]
